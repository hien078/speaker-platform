# LoaViet — production stack
# Chạy:  docker compose -f docker-compose.prod.yml up -d --build
# Migrations (graph migrations/app/, tới ref 'production') chạy TỰ ĐỘNG qua
# service 'migrate' trước khi app start (app depends_on migrate completed).
# Chạy tay khi cần:  docker compose -f docker-compose.prod.yml run --rm migrate
# KHÔNG dùng 'prisma db update' trên DB production — không để lại lịch sử migration.
# Seed (chỉ dev/test): seed từ chối chạy ở production (NODE_ENV=production).

services:
  db:
    image: postgres:16-alpine
    # Tên cố định cho ops deterministic (backup cron: docker exec loaviet-db ...)
    container_name: loaviet-db
    restart: unless-stopped
    # M1 (Batch 4 Task 3 review): bound bộ nhớ db — host 1-2GB chung app, không
    # để query lớn (evidence snapshots, full-text) kéo cả host; OOM-kill land vào
    # container (restart: unless-stopped tự lên lại) thay vì host. Postgres 16
    # mặc định shared_buffers 128MB — 512M đủ cho beta single-instance.
    mem_limit: 512m
    environment:
      POSTGRES_USER: loaviet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?đặt DB_PASSWORD trong .env}
      POSTGRES_DB: loaviet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loaviet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # KHÔNG expose port ra ngoài — chỉ app kết nối trong network

  # One-shot: áp pending migrations tới ref 'production' rồi thoát.
  # Idempotent — chạy lại không áp lại migration đã chạy (marker trong DB).
  # Cũng là image chạy admin bootstrap offline (Task 11 runbook §0):
  #   docker compose -f docker-compose.prod.yml run --rm \
  #     -v "$PWD/scripts:/app/scripts:ro" -v "$PWD/src:/app/src:ro" \
  #     migrate npx tsx scripts/admin-bootstrap.ts <subcommand> …
  # (stage migrate có node_modules + tsx nhưng KHÔNG copy scripts/ + src/lib —
  # mount từ repo trên VPS; db KHÔNG publish port nên phải đi qua network này.)
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://loaviet:${DB_PASSWORD}@db:5432/loaviet
      # Task 11 runbook §0: admin bootstrap (tsx trong container migrate) cần
      # key mã hóa TOTP secret + AUTH_SECRET (hash mã khôi phục derive HKDF).
      # Compose nội suy từ .env — operator KHÔNG phải `set -a; source .env`.
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:?đặt ADMIN_MFA_ENCRYPTION_KEY trong .env (openssl rand -base64 32)}
      AUTH_SECRET: ${AUTH_SECRET:?đặt AUTH_SECRET trong .env}

  app:
    build: .
    container_name: loaviet-app
    restart: unless-stopped
    # M1 (Batch 4 Task 3 review + fix 2): bound bộ nhớ app — sharp re-encode
    # decode theo định dạng (PNG interlaced/16-bit ~200-400MB/lần nếu không
    # bound). Trong app đã có semaphore 1-re-encode-đồng-thời + HÀNG CHỜ
    # BOUNDED (REENCODE_MAX_QUEUE=2 — đầy reject ngay, không cho 20 waiter giữ
    # ~300MB body buffer) + 1 upload in-flight/user + sharp.cache(false) +
    # sharp.concurrency(1) (src/lib/image-process.ts, app/api/upload/route.ts)
    # nên worst-case process ≈ baseline Next ~250MB + 1 decode 50MP JPEG
    # progressive + EXIF rotate ~300MB transient + ~15MB body buffer của 2
    # waiter ≈ 550-600MB. 768m chặn OOM lan sang db/host; OOM-kill land vào
    # container (restart tự lên lại). Budget chi tiết + khuyến nghị RAM host
    # (2GB cho production): docs/deployment.md §1. Host 1GB: hạ xuống 512m +
    # hạ cap ảnh (image-process.ts) theo runbook.
    mem_limit: 768m
    ports:
      # CHỈ bind loopback — nginx (cùng host) proxy sang đây; KHÔNG expose
      # app trực tiếp ra internet (rate limit đọc proxy header chỉ khi
      # TRUST_PROXY_HEADERS=true — expose trực tiếp = kẻ spoof identity).
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://loaviet:${DB_PASSWORD}@db:5432/loaviet
      AUTH_SECRET: ${AUTH_SECRET:?đặt AUTH_SECRET trong .env}
      # Key mã hóa TOTP secret admin (AdminMfa) — DÀNG RIÊNG, KHÔNG derive từ
      # AUTH_SECRET. Base64 của đúng 32 byte (openssl rand -base64 32).
      # Thiếu → compose từ chối start (lỗi hiện ngay khi up) + validateEnv
      # fail-fast trong app (Batch 2 Task 8 — MFA bắt buộc cho admin).
      ADMIN_MFA_ENCRYPTION_KEY: ${ADMIN_MFA_ENCRYPTION_KEY:?đặt ADMIN_MFA_ENCRYPTION_KEY trong .env (openssl rand -base64 32)}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?đặt NEXT_PUBLIC_APP_URL trong .env}
      # Private beta (spec §4.1/§5.1): tài chính TẮT — mọi entry point finance
      # (escrow/thanh toán/ví/rút tiền/hoa hồng) deny server-side với mã
      # FINANCIAL_FEATURES_DISABLED. Server-only, không có escape hatch client;
      # "true" ở production bị validateEnv fail-fast từ chối ngay khi start.
      # Chỉ đổi qua reviewed product decision + restart (không phải admin toggle).
      FINANCIAL_FEATURES_ENABLED: "false"
      ESCROW_AUTO_RELEASE_DAYS: "7"
      # Bảo vệ POST /api/cron/auto-release (escrow auto-release mỗi giờ)
      CRON_SECRET: ${CRON_SECRET:?đặt CRON_SECRET trong .env}
      # Tin proxy header (nginx local đặt x-real-ip) — app chỉ nghe trên 127.0.0.1
      TRUST_PROXY_HEADERS: "true"
      # MoMo production — điền credentials thật từ business.momo.vn
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://payment.momo.vn}
    volumes:
      - uploads:/app/public/uploads

volumes:
  pgdata:
  uploads:
