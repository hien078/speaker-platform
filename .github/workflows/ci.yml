name: CI

on:
  push:
    branches: [main, "ops/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma contract emit + drift check
        run: |
          npx prisma contract emit
          if ! git diff --exit-code -- src/prisma; then
            echo "::error::contract artifacts drift so với contract.prisma — chạy 'npx prisma contract emit' rồi commit"
            exit 1
          fi

      - name: Lint (0 errors, 0 warnings)
        run: npm run lint

      - name: Typecheck
        # next typegen sinh PageProps/LayoutProps/RouteContext (.next/types) — tsc cần trước
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # placeholder — build không kết nối DB (giống Dockerfile builder stage)
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-placeholder

      - name: Migration graph validation (offline)
        run: npx prisma migration list
